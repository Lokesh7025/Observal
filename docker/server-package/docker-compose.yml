# Standalone Observal deployment — uses pre-built images from GHCR.
# Generated for curl-install: no source code or build context required.

services:
  observal-init:
    image: ghcr.io/observal/observal-api:${OBSERVAL_VERSION:-latest}
    command: ["/app/entrypoint.sh"]
    env_file:
      - ./.env
    group_add:
      - "${OBSERVAL_SECRET_GID:-1000}"
    depends_on:
      observal-db:
        condition: service_healthy
      observal-telemetry:
        condition: service_healthy
      observal-redis:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - observal-net

  observal-api:
    image: ghcr.io/observal/observal-api:${OBSERVAL_VERSION:-latest}
    command: ["/app/.venv/bin/python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./.env
    group_add:
      - "${OBSERVAL_SECRET_GID:-1000}"
    environment:
      - JWT_KEY_DIR=/data/keys
      - MIGRATION_ARTIFACT_ROOT=/data/migration_artifacts
      - SKIP_DDL_ON_STARTUP=true
      - DEMO_SUPER_ADMIN_EMAIL=${DEMO_SUPER_ADMIN_EMAIL:-super@demo.example}
      - DEMO_ADMIN_EMAIL=${DEMO_ADMIN_EMAIL:-admin@demo.example}
      - DEMO_REVIEWER_EMAIL=${DEMO_REVIEWER_EMAIL:-reviewer@demo.example}
      - DEMO_USER_EMAIL=${DEMO_USER_EMAIL:-user@demo.example}
    volumes:
      - apidata:/data
      - ./secrets:/run/secrets:ro
    depends_on:
      observal-init:
        condition: service_completed_successfully
      observal-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: 512M
    networks:
      - observal-net

  observal-db:
    image: postgres:18
    group_add:
      - "${OBSERVAL_SECRET_GID:-1000}"
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: observal
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./secrets/postgres:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - observal-net

  observal-telemetry:
    # Single-writer DuckDB telemetry store. Same image as the API; one process only.
    image: ghcr.io/observal/observal-api:${OBSERVAL_VERSION:-latest}
    command: ["/app/.venv/bin/python", "-m", "telemetry_store"]
    group_add:
      - "${OBSERVAL_SECRET_GID:-1000}"
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${TELEMETRY_HOST_PORT:-8125}:8125"
    environment:
      - TELEMETRY_DB_PATH=/data/telemetry/observal.duckdb
      - TELEMETRY_TEMP_DIR=/data/telemetry/tmp
      - TELEMETRY_EXPORT_DIR=${TELEMETRY_EXPORT_DIR:-/data/telemetry/exports}
      - TELEMETRY_BACKUP_DIR=${TELEMETRY_BACKUP_DIR:-/data/telemetry/backups}
      - TELEMETRY_MAX_IMPORT_CHUNK_BYTES=${TELEMETRY_MAX_IMPORT_CHUNK_BYTES:-1073741824}
      - TELEMETRY_MIN_FREE_SPACE_BYTES=${TELEMETRY_MIN_FREE_SPACE_BYTES:-268435456}
      - TELEMETRY_BIND=0.0.0.0:8125
      - TELEMETRY_TOKEN_FILE=/run/secrets/telemetry_token
      - TELEMETRY_MEMORY_LIMIT=${TELEMETRY_MEMORY_LIMIT_DUCKDB:-1536MB}
      - TELEMETRY_THREADS=${TELEMETRY_THREADS:-4}
      - TELEMETRY_METRICS_PUBLIC=true
    volumes:
      # Mounted at /data (owned by appuser in the image) so a fresh named volume
      # inherits that ownership; the service creates /data/telemetry itself.
      - tdata:/data
      - ./secrets/telemetry:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8125/v1/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${TELEMETRY_MEMORY_LIMIT:-2G}
    networks:
      - observal-net

  # Legacy ClickHouse, only for the one-time cutover of existing installs:
  #   docker compose --profile legacy-clickhouse up -d observal-clickhouse
  #   observal server migrate telemetry-cutover --clickhouse-url ... --telemetry-url http://localhost:8125
  # The chdata volume is kept until you remove it explicitly.
  observal-clickhouse:
    profiles: ["legacy-clickhouse"]
    image: clickhouse/clickhouse-server:26.6
    group_add:
      - "${OBSERVAL_SECRET_GID:-1000}"
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_HOST_PORT:-8123}:8123"
    environment:
      MAX_SERVER_MEMORY_USAGE_RATIO: "0.8"
      HEALTHCHECK_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ./secrets/clickhouse:/run/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -s /run/secrets/clickhouse_password ]; then clickhouse-client --password \"$$(cat /run/secrets/clickhouse_password)\" --query 'SELECT 1'; else clickhouse-client --password \"$${HEALTHCHECK_CLICKHOUSE_PASSWORD:-clickhouse}\" --query 'SELECT 1'; fi",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEMORY_LIMIT:-2G}
    networks:
      - observal-net

  observal-redis:
    image: redis:8-alpine
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - observal-net

  observal-worker:
    image: ghcr.io/observal/observal-api:${OBSERVAL_VERSION:-latest}
    command: ["/app/.venv/bin/python", "-c", "import asyncio; asyncio.set_event_loop(asyncio.new_event_loop()); from arq import run_worker; from worker import WorkerSettings; run_worker(WorkerSettings)"]
    env_file:
      - ./.env
    environment:
      - MIGRATION_ARTIFACT_ROOT=/data/migration_artifacts
    group_add:
      - "${OBSERVAL_SECRET_GID:-1000}"
    volumes:
      - ./secrets:/run/secrets:ro
      - apidata:/data
    depends_on:
      observal-init:
        condition: service_completed_successfully
      observal-redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: 512M
    networks:
      - observal-net

  observal-web:
    image: ghcr.io/observal/observal-web:${OBSERVAL_VERSION:-latest}
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      observal-lb:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/log/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - observal-net

  observal-lb:
    image: nginx:alpine
    ports:
      - "${OBSERVAL_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      observal-api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - observal-net


volumes:
  pgdata:
  tdata:
  # Legacy ClickHouse data (pre-DuckDB installs). Declared so rollback stays possible.
  chdata:
  redisdata:
  apidata:

networks:
  observal-net:
    driver: bridge
