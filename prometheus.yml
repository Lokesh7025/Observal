global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "observal-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["observal-api:8000"]
        labels:
          service: "observal-api"
  # The compose stacks start the telemetry store with TELEMETRY_METRICS_PUBLIC=true
  # so /metrics (counters and table sizes only) is scrapeable inside observal-net.
  - job_name: "observal-telemetry"
    metrics_path: /metrics
    static_configs:
      - targets: ["observal-telemetry:8125"]
        labels:
          service: "observal-telemetry"
